plugins {
    id 'java'
}

group = 'dev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform(libs.junit.bom.platform)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.mockito.core

    implementation libs.guava
    implementation libs.logback.classic

    implementation libs.jackson.databind
}

test {
    useJUnitPlatform()
}

tasks.register('runGalaxyGenerator', JavaExec) {
    group = 'application'
    description = 'Run galaxy generator with config parameter'
    mainClass = 'galaxy.dev.generator.GalaxyGeneratorApp'
    classpath = sourceSets.main.runtimeClasspath

    if (project.hasProperty('appArgs')) {
        args(project.property('appArgs').toString().split(' '))
    }
}
