# Memory Management & GC Optimization
org.gradle.jvmargs=-Xms2g -Xmx6g -XX:+UseG1GC -XX:+UnlockExperimentalVMOptions -XX:+UseFastUnorderedTimeStamps -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8

# Performance & Caching Features
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
